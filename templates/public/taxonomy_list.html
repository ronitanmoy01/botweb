{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-7xl px-4 py-12">
  <h1 class="text-3xl font-bold">{{ heading }}</h1>

  {% if items %}
  <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    {% for item in items %}
    <a href="{{ base_path }}/{{ item.slug }}/" class="group block rounded-lg bg-card p-4 hover:bg-white/5">
      <h3 class="font-semibold group-hover:text-accent">{{ item.name }}</h3>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p class="mt-8 text-gray-400">Nothing here yet.</p>
  {% endif %}
</section>
{% endblock %}
