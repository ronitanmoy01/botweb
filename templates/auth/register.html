{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-16">
  <h1 class="mb-6 text-3xl font-bold">Create account</h1>
  {% include "components/form_errors.html" %}
  <form method="post" action="/register/" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="block">
      <span class="text-sm text-gray-300">Display name</span>
      <input name="display_name" type="text" maxlength="100" autocomplete="nickname" value="{{ display_name or '' }}"
             class="mt-1 w-full rounded-lg bg-card px-3 py-2 text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-accent">
    </label>
    <label class="block">
      <span class="text-sm text-gray-300">Email</span>
      <input name="email" type="email" required autocomplete="email" value="{{ email or '' }}"
             class="mt-1 w-full rounded-lg bg-card px-3 py-2 text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-accent">
    </label>
    <label class="block">
      <span class="text-sm text-gray-300">Password (at least 12 characters)</span>
      <input name="password" type="password" required minlength="12" autocomplete="new-password"
             class="mt-1 w-full rounded-lg bg-card px-3 py-2 text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-accent">
    </label>
    <button type="submit" class="w-full rounded-lg bg-accent px-4 py-2 font-semibold hover:opacity-90">Create account</button>
  </form>
  <p class="mt-4 text-sm text-gray-400">Already registered? <a href="/login/" class="text-white underline">Sign in</a></p>
</section>
{% endblock %}
