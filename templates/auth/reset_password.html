{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-16">
  <h1 class="mb-4 text-3xl font-bold">Choose a new password</h1>
  {% include "components/form_errors.html" %}
  {% if success %}
  <div class="mb-4 rounded-lg border border-green-500/40 bg-green-500/10 p-3 text-sm text-green-200" role="status">{{ success }}</div>
  <p class="mt-4 text-sm text-gray-400"><a href="/login/" class="text-white underline">Sign in with your new password</a></p>
  {% elif errors %}
  <p class="mt-4 text-sm text-gray-400">The link may have expired. <a href="/forgot-password/" class="text-white underline">Request a new one</a>.</p>
  {% else %}
  <form method="post" action="/reset-password/{{ token }}/" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="block">
      <span class="text-sm text-gray-300">New password (at least 12 characters)</span>
      <input name="password" type="password" required minlength="12" autocomplete="new-password"
             class="mt-1 w-full rounded-lg bg-card px-3 py-2 text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-accent">
    </label>
    <label class="block">
      <span class="text-sm text-gray-300">Confirm new password</span>
      <input name="confirm" type="password" required minlength="12" autocomplete="new-password"
             class="mt-1 w-full rounded-lg bg-card px-3 py-2 text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-accent">
    </label>
    <button type="submit" class="w-full rounded-lg bg-accent px-4 py-2 font-semibold hover:opacity-90">Save new password</button>
  </form>
  {% endif %}
</section>
{% endblock %}
