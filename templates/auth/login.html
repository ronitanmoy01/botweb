{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-16">
  <h1 class="mb-6 text-3xl font-bold">Sign in</h1>
  {% include "components/form_errors.html" %}
  <form method="post" action="/login/" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="block">
      <span class="text-sm text-gray-300">Email</span>
      <input name="email" type="email" required autocomplete="email" value="{{ email or '' }}"
             class="mt-1 w-full rounded-lg bg-card px-3 py-2 text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-accent">
    </label>
    <label class="block">
      <span class="text-sm text-gray-300">Password</span>
      <input name="password" type="password" required autocomplete="current-password"
             class="mt-1 w-full rounded-lg bg-card px-3 py-2 text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-accent">
    </label>
    <button type="submit" class="w-full rounded-lg bg-accent px-4 py-2 font-semibold hover:opacity-90">Sign in</button>
  </form>
  <p class="mt-4 text-sm text-gray-400">No account? <a href="/register/" class="text-white underline">Create one</a></p>
</section>
{% endblock %}
